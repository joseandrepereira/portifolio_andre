<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>José André | Desenvolvedor Full Stack</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Redireciona qualquer rota 404 de volta para o index.html da SPA.
      O GitHub Pages serve este arquivo para rotas desconhecidas.
      Como o app usa HashHistory (#/), na prática este fallback raramente
      é necessário, mas serve como segurança extra.
    -->
    <script>
      // Redireciona para a raiz mantendo o hash/path como parâmetro de query
      // para que o index.html possa redirecionar de volta à rota correta.
      const repo = "/portifoli_andre";
      const path = window.location.pathname.replace(repo, "");
      const search = window.location.search;
      const hash = window.location.hash;
      window.location.replace(
        repo + "/?redirect=" + encodeURIComponent(path + search) + hash
      );
    </script>
  </head>
  <body></body>
</html>
